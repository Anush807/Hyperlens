[project]
name = "hvops-api"
version = "1.0.0"
description = "HVOps core API: auth, inventory, metrics, ML and assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "greenlet==3.1.1",
    "motor==3.6.0",
    "pymongo==4.9.2",
    "PyJWT==2.10.1",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    "APScheduler==3.11.0",
    "httpx==0.28.1",
    "openai==1.59.6",
    "sse-starlette==2.2.1",
    "python-multipart==0.0.20",
    "PyYAML==6.0.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.6.0",
    "torch==2.5.1",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "testcontainers[postgres,mongodb]==4.9.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "types-PyYAML==6.0.12.20240917",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app", "ml"]
omit = ["*/tests/*", "*/alembic/*"]
