[project]
name = "hvops-collector"
version = "1.0.0"
description = "HVOps collector: vSphere and Nutanix adapters, synthetic metrics, scheduler"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.0",
    "gunicorn==23.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "APScheduler==3.11.0",
    "httpx==0.28.1",
    "pyvmomi==8.0.3.0.1",
    "PyYAML==6.0.2",
    "numpy==2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "types-PyYAML==6.0.12.20240917",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
